services:
  db:
    image: postgres:16
    container_name: blog_auth_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - auth-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    container_name: blog_auth_mail
    restart: always
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  auth-dbdata:
